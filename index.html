<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>麻將戰績紀錄 v7.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .active-tab { border-bottom: 4px solid #10b981; color: #10b981; font-weight: 900; }
        .filter-btn.active { background-color: #10b981; color: white; border-color: #10b981; }
        .recording { animation: pulse 1.5s infinite; color: #ef4444; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        /* 表格滾動優化 */
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { border-collapse: separate; border-spacing: 0; }
        th { position: sticky; left: 0; z-index: 10; }
    </style>
</head>
<body class="pb-24">

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex z-50 shadow-lg">
        <button onclick="switchTab('dashboard')" id="tab-dashboard" class="flex-1 py-4 text-slate-400 active-tab">📊 戰報</button>
        <button onclick="switchTab('record')" id="tab-record" class="flex-1 py-4 text-slate-400">📝 紀錄</button>
        <button onclick="switchTab('admin')" id="tab-admin" class="flex-1 py-4 text-slate-400">⚙️ 管理</button>
    </nav>

    <div class="max-w-4xl mx-auto p-4">
        
        <section id="dashboard-page" class="tab-content active">
            <header class="mb-6 mt-4 flex justify-between items-center">
                <h1 class="text-3xl font-black text-slate-800">戰績分析</h1>
                <button onclick="exportImage()" class="text-xs bg-emerald-50 text-emerald-600 px-3 py-1 rounded-full font-black">📸 截圖戰報</button>
            </header>

            <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-100 mb-6">
                <div class="flex gap-2">
                    <button onclick="setDateRange('all')" id="range-all" class="filter-btn flex-1 py-1 text-xs font-bold border rounded-full text-slate-500 active">全部</button>
                    <button onclick="setDateRange('month')" id="range-month" class="filter-btn flex-1 py-1 text-xs font-bold border rounded-full text-slate-500">本月</button>
                    <button onclick="setDateRange('quarter')" id="range-quarter" class="filter-btn flex-1 py-1 text-xs font-bold border rounded-full text-slate-500">本季</button>
                    <button onclick="toggleCustomRange()" id="range-custom" class="filter-btn flex-1 py-1 text-xs font-bold border rounded-full text-slate-500">自訂</button>
                </div>
                <div id="custom-range-inputs" class="hidden flex items-center gap-2 mt-2 pt-2 border-t border-dashed">
                    <input type="date" id="filter-start" onchange="updateDashboard()" class="flex-1 text-xs border-none bg-slate-50 rounded-lg p-2">
                    <input type="date" id="filter-end" onchange="updateDashboard()" class="flex-1 text-xs border-none bg-slate-50 rounded-lg p-2">
                </div>
            </div>

            <div class="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-100 mb-6">
                <h2 class="text-sm font-black text-slate-400 uppercase mb-4 tracking-widest">🏆 積分趨勢圖</h2>
                <div class="h-64">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>

            <div id="dashboardCard" class="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-100 mb-8">
                <div class="flex justify-between items-center mb-6"><span id="range-label" class="text-emerald-600 text-xs font-black uppercase">所有紀錄</span></div>
                <div class="space-y-5" id="rankingList"></div>
            </div>

            <h2 class="text-xl font-black text-slate-800 mb-4 px-2">📋 紀錄明細表</h2>
            <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden mb-6">
                <div class="table-container">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 text-slate-500 font-bold">
                            <tr id="tableHeader"></tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="record-page" class="tab-content">
            <header class="mb-6 mt-4 flex justify-between items-end"><h1 class="text-3xl font-black text-slate-800">新增紀錄</h1><input type="date" id="matchDate" class="bg-transparent text-slate-600 font-bold border-none text-right"></header>
            <div id="scoreInputs" class="space-y-3 mb-8"></div>
            <div class="bg-white p-6 rounded-[2rem] shadow-xl">
                <div class="flex justify-between items-center mb-4"><span class="text-slate-500 font-bold">加總校驗</span><span id="totalCheck" class="text-4xl font-black text-rose-500">0</span></div>
                <button onclick="saveMatch()" id="saveBtn" class="w-full bg-slate-800 text-white py-5 rounded-2xl font-black text-xl shadow-lg disabled:bg-slate-100 disabled:text-slate-300" disabled>儲存成績</button>
            </div>
        </section>

        <section id="admin-page" class="tab-content">
            <header class="mb-6 mt-4"><h1 class="text-3xl font-black text-slate-800">管理</h1></header>
            <div class="bg-white rounded-3xl p-6 shadow-sm mb-6">
                <button onclick="exportExcel()" class="w-full bg-slate-800 text-white py-3 rounded-xl mb-3 font-bold">📤 匯出 Excel</button>
                <label class="block w-full bg-emerald-600 text-white py-3 rounded-xl font-bold text-center cursor-pointer">📥 匯入 Excel / CSV<input type="file" class="hidden" onchange="importFromExcel(event)"></label>
            </div>
            <div id="playerManagementList" class="bg-white rounded-3xl p-6 shadow-sm"></div>
        </section>
    </div>

    <script>
        let players = JSON.parse(localStorage.getItem('mj_players')) || ["Daniel", "Ken", "Roger", "CK", "Totoron", "Host"];
        let records = JSON.parse(localStorage.getItem('mj_records')) || [];
        let currentRange = 'all';
        let trendChart = null;

        window.onload = () => {
            document.getElementById('matchDate').valueAsDate = new Date();
            renderScoreInputs();
            updateDashboard();
        };

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active-tab'));
            document.getElementById(`${tabId}-page`).classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active-tab');
            if(tabId === 'dashboard') updateDashboard();
            if(tabId === 'admin') renderPlayerManagement();
        }

        function getFilteredRecords() {
            const now = new Date();
            return records.filter(r => {
                const rDate = new Date(r.date.replace(/年|月|日/g, '-'));
                if (currentRange === 'all') return true;
                if (currentRange === 'month') return rDate.getMonth() === now.getMonth() && rDate.getFullYear() === now.getFullYear();
                if (currentRange === 'quarter') return Math.ceil((rDate.getMonth()+1)/3) === Math.ceil((now.getMonth()+1)/3) && rDate.getFullYear() === now.getFullYear();
                if (currentRange === 'custom') {
                    const s = document.getElementById('filter-start').value;
                    const e = document.getElementById('filter-end').value;
                    return (!s || rDate >= new Date(s)) && (!e || rDate <= new Date(e));
                }
            }).sort((a, b) => new Date(a.date.replace(/年|月|日/g, '-')) - new Date(b.date.replace(/年|月|日/g, '-')));
        }

        function updateDashboard() {
            const filtered = getFilteredRecords();
            renderChart(filtered);
            renderLeaderboard(filtered);
            renderTable(filtered);
        }

        // --- 趨勢圖繪製 ---
        function renderChart(filteredRecords) {
            const ctx = document.getElementById('trendChart').getContext('2d');
            if (trendChart) trendChart.destroy();

            const datasets = players.map((name, idx) => {
                let sum = 0;
                const data = filteredRecords.map(r => {
                    sum += (r.scores[name] || 0);
                    return sum;
                });
                const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#64748b'];
                return { label: name, data: data, borderColor: colors[idx % colors.length], tension: 0.3, fill: false };
            });

            trendChart = new Chart(ctx, {
                type: 'line',
                data: { labels: filteredRecords.map(r => r.date.split('-').slice(1).join('/')), datasets },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } }, scales: { y: { grid: { color: '#f1f5f9' } } } }
            });
        }

        // --- 排行榜 ---
        function renderLeaderboard(filtered) {
            const stats = players.map(p => {
                let total = 0, count = 0;
                filtered.forEach(r => { if (r.scores[p] !== undefined) { total += r.scores[p]; count++; } });
                return { name: p, total, count };
            }).sort((a, b) => b.total - a.total);

            document.getElementById('rankingList').innerHTML = stats.map((s, idx) => {
                let icon = (idx === 0 && s.count > 0) ? '👑 ' : (idx === stats.length-1 && s.count > 0) ? '💪 ' : '';
                return `<div class="flex items-center justify-between border-b border-slate-50 pb-4 last:border-0">
                    <div class="flex items-center gap-4"><span class="text-xl font-black ${idx==0?'text-amber-400':'text-slate-200'}">${idx+1}</span>
                    <div><p class="font-black text-slate-800 text-lg">${icon}${s.name}</p><p class="text-[10px] font-bold text-slate-400">場數: ${s.count}</p></div></div>
                    <div class="text-right font-mono font-black text-2xl ${s.total >= 0 ? 'text-rose-500' : 'text-emerald-600'}">${s.total > 0 ? '+' + s.total : s.total}</div></div>`;
            }).join('');
        }

        // --- 表格化紀錄與修改 ---
        function renderTable(filtered) {
            const header = document.getElementById('tableHeader');
            header.innerHTML = `<th class="p-3 bg-slate-50">日期</th>` + players.map(p => `<th class="p-3">${p}</th>`).join('') + `<th class="p-3 text-center">操作</th>`;

            const body = document.getElementById('tableBody');
            body.innerHTML = [...filtered].reverse().map(r => {
                const rIdx = records.indexOf(r);
                return `<tr>
                    <td class="p-3 whitespace-nowrap font-bold text-slate-500">${r.date}</td>
                    ${players.map(p => {
                        const s = r.scores[p];
                        return `<td class="p-3 font-mono font-bold ${s > 0 ? 'text-rose-500' : (s < 0 ? 'text-emerald-600' : 'text-slate-300')}">${s ?? '-'}</td>`;
                    }).join('')}
                    <td class="p-3 text-center">
                        <button onclick="editRecord(${rIdx})" class="text-blue-500 mr-2">改</button>
                        <button onclick="deleteRecord(${rIdx})" class="text-rose-400">刪</button>
                    </td>
                </tr>`;
            }).join('');
        }

        function editRecord(idx) {
            const r = records[idx];
            players.forEach(p => {
                const val = prompt(`修改 ${r.date} ${p} 的分數:`, r.scores[p] ?? "");
                if (val !== null) {
                    if (val === "" || val === "-") delete r.scores[p];
                    else r.scores[p] = Number(val);
                }
            });
            localStorage.setItem('mj_records', JSON.stringify(records));
            updateDashboard();
        }

        // --- 以下為 v6.1 基礎功能 (新增、語音、匯入等) ---
        function renderScoreInputs() {
            document.getElementById('scoreInputs').innerHTML = players.map(p => `
                <div class="bg-white p-4 rounded-2xl flex items-center shadow-sm border border-slate-50">
                    <div class="w-1/2">
                        <span class="block font-black text-slate-700">${p}</span>
                        <button onclick="startVoice('${p}')" id="vbtn-${p}" class="text-[10px] text-emerald-500 font-bold">🎤 語音</button>
                    </div>
                    <div class="w-1/2"><input type="text" oninput="calculateTotal()" data-player="${p}" placeholder="-" class="score-input w-full text-right text-2xl font-mono font-black bg-transparent border-none"></div>
                </div>`).join('');
        }

        function calculateTotal() {
            let total = 0, count = 0;
            document.querySelectorAll('.score-input').forEach(i => { const v = i.value.trim(); if(v !== "" && v !== "-") { total += Number(v); count++; } });
            document.getElementById('totalCheck').innerText = total;
            document.getElementById('saveBtn').disabled = !(total === 0 && count > 0);
        }

        function saveMatch() {
            const date = document.getElementById('matchDate').value;
            const scores = {};
            document.querySelectorAll('.score-input').forEach(i => { const v = i.value.trim(); if(v !== "" && v !== "-") scores[i.dataset.player] = Number(v); });
            records.push({ date, scores });
            localStorage.setItem('mj_records', JSON.stringify(records));
            location.reload();
        }

        function deleteRecord(idx) { if(confirm("確定刪除？")) { records.splice(idx, 1); localStorage.setItem('mj_records', JSON.stringify(records)); updateDashboard(); } }
        function setDateRange(range) { currentRange = range; updateDashboard(); }
        function toggleCustomRange() { document.getElementById('custom-range-inputs').classList.toggle('hidden'); currentRange = 'custom'; }
        function startVoice(p) { /* 同 v6.1 語音辨識代碼... */ }
        function renderPlayerManagement() { /* 同 v6.1... */ }
        function exportExcel() { /* 同 v6.1... */ }
        function importFromExcel(e) { /* 同 v6.1... */ }
    </script>
</body>
</html>
