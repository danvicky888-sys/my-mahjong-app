<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>麻將戰績紀錄 v6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f1f5f9; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .active-tab { border-bottom: 4px solid #10b981; color: #10b981; font-weight: 900; }
        .filter-btn.active { background-color: #10b981; color: white; border-color: #10b981; }
    </style>
</head>
<body class="pb-24">

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex z-50 shadow-[0_-5px_15px_rgba(0,0,0,0.05)]">
        <button onclick="switchTab('dashboard')" id="tab-dashboard" class="flex-1 py-4 text-slate-400 active-tab">📊 戰報</button>
        <button onclick="switchTab('record')" id="tab-record" class="flex-1 py-4 text-slate-400">📝 紀錄</button>
        <button onclick="switchTab('admin')" id="tab-admin" class="flex-1 py-4 text-slate-400">⚙️ 管理</button>
    </nav>

    <div class="max-w-md mx-auto p-4">
        
        <section id="dashboard-page" class="tab-content active">
            <header class="mb-6 mt-4 flex justify-between items-center">
                <h1 class="text-3xl font-black text-slate-800">戰績分析</h1>
                <button onclick="exportImage()" class="text-xs bg-emerald-50 text-emerald-600 px-3 py-1 rounded-full font-black">📸 分享</button>
            </header>

            <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-100 mb-6">
                <div class="flex gap-2 mb-4">
                    <button onclick="setDateRange('all')" id="range-all" class="filter-btn flex-1 py-1 text-xs font-bold border rounded-full text-slate-500 active">全部</button>
                    <button onclick="setDateRange('month')" id="range-month" class="filter-btn flex-1 py-1 text-xs font-bold border rounded-full text-slate-500">本月</button>
                    <button onclick="setDateRange('quarter')" id="range-quarter" class="filter-btn flex-1 py-1 text-xs font-bold border rounded-full text-slate-500">本季</button>
                    <button onclick="toggleCustomRange()" id="range-custom" class="filter-btn flex-1 py-1 text-xs font-bold border rounded-full text-slate-500">自訂</button>
                </div>
                <div id="custom-range-inputs" class="hidden flex items-center gap-2 mt-2 pt-2 border-t border-dashed">
                    <input type="date" id="filter-start" onchange="updateDashboard()" class="flex-1 text-xs border-none bg-slate-50 rounded-lg p-2">
                    <span class="text-slate-300">至</span>
                    <input type="date" id="filter-end" onchange="updateDashboard()" class="flex-1 text-xs border-none bg-slate-50 rounded-lg p-2">
                </div>
            </div>

            <div id="dashboardCard" class="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-100 mb-8">
                <div class="flex justify-between items-center mb-6">
                    <span id="range-label" class="text-emerald-600 text-xs font-black tracking-widest uppercase">所有紀錄</span>
                    <span class="text-slate-300 text-[10px] font-bold">RANKING</span>
                </div>
                <div class="space-y-5" id="rankingList"></div>
            </div>

            <h2 class="text-xl font-black text-slate-800 mb-4 px-2">📜 區間紀錄清單</h2>
            <div id="historyList" class="space-y-3"></div>
        </section>

        <section id="record-page" class="tab-content">
            <header class="mb-6 mt-4 flex justify-between items-end"><h1 class="text-3xl font-black text-slate-800">新增紀錄</h1><input type="date" id="matchDate" class="bg-transparent text-slate-600 font-bold border-none text-right"></header>
            <div id="scoreInputs" class="space-y-3 mb-8"></div>
            <div class="bg-white p-6 rounded-[2rem] shadow-xl">
                <div class="flex justify-between items-center mb-4"><span class="text-slate-500 font-bold">加總校驗</span><span id="totalCheck" class="text-4xl font-black text-rose-500">0</span></div>
                <button onclick="saveMatch()" id="saveBtn" class="w-full bg-slate-800 text-white py-5 rounded-2xl font-black text-xl shadow-lg disabled:bg-slate-100 disabled:text-slate-300" disabled>儲存成績</button>
            </div>
        </section>

        <section id="admin-page" class="tab-content">
            <header class="mb-6 mt-4"><h1 class="text-3xl font-black text-slate-800">系統管理</h1></header>
            <div class="bg-white rounded-3xl p-6 shadow-sm mb-6">
                <h2 class="font-bold text-slate-800 mb-4">📥 數據導入/匯出</h2>
                <div class="grid grid-cols-1 gap-3">
                    <button onclick="exportExcel()" class="bg-slate-800 text-white py-3 rounded-xl text-sm font-bold">📤 匯出 Excel</button>
                    <label class="bg-emerald-600 text-white py-3 rounded-xl text-sm font-bold text-center cursor-pointer">📥 匯入 Excel / CSV<input type="file" class="hidden" accept=".csv, .xlsx, .xls" onchange="importFromExcel(event)"></label>
                </div>
            </div>
            <div class="bg-white rounded-3xl p-6 shadow-sm mb-6">
                <h2 class="font-bold text-slate-800 mb-4">👥 成員管理</h2>
                <div id="playerManagementList" class="space-y-2 mb-4"></div>
                <div class="flex gap-2"><input type="text" id="newPlayerName" placeholder="新成員" class="flex-1 bg-slate-100 p-3 rounded-xl"><button onclick="addPlayer()" class="bg-emerald-600 text-white px-6 rounded-xl font-bold">＋</button></div>
            </div>
            <button onclick="clearData()" class="w-full bg-white p-4 rounded-3xl shadow-sm text-rose-600 font-bold">🗑️ 清除所有紀錄</button>
        </section>
    </div>

    <script>
        const DEFAULT_PLAYERS = ["Daniel", "Ken", "Roger", "CK", "Totoron", "Host"];
        let players = JSON.parse(localStorage.getItem('mj_players')) || DEFAULT_PLAYERS;
        let records = JSON.parse(localStorage.getItem('mj_records')) || [];
        let currentRange = 'all';

        window.onload = () => {
            document.getElementById('matchDate').valueAsDate = new Date();
            renderScoreInputs();
            updateDashboard();
        };

        // --- 核心：日期過濾邏輯 ---
        function setDateRange(range) {
            currentRange = range;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`range-${range}`).classList.add('active');
            document.getElementById('custom-range-inputs').classList.add('hidden');
            updateDashboard();
        }

        function toggleCustomRange() {
            const panel = document.getElementById('custom-range-inputs');
            panel.classList.toggle('hidden');
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`range-custom`).classList.add('active');
            currentRange = 'custom';
        }

        function getFilteredRecords() {
            const now = new Date();
            return records.filter(r => {
                const rDate = new Date(r.date.replace(/年|月/g, '-').replace(/日/g, ''));
                if (currentRange === 'all') return true;
                if (currentRange === 'month') return rDate.getMonth() === now.getMonth() && rDate.getFullYear() === now.getFullYear();
                if (currentRange === 'quarter') {
                    const currentQ = Math.ceil((now.getMonth() + 1) / 3);
                    const recordQ = Math.ceil((rDate.getMonth() + 1) / 3);
                    return currentQ === recordQ && rDate.getFullYear() === now.getFullYear();
                }
                if (currentRange === 'custom') {
                    const start = document.getElementById('filter-start').value;
                    const end = document.getElementById('filter-end').value;
                    if (!start || !end) return true;
                    return rDate >= new Date(start) && rDate <= new Date(end);
                }
                return true;
            });
        }

        // --- 介面更新 ---
        function updateDashboard() {
            const filtered = getFilteredRecords();
            const rangeLabels = { all: '所有紀錄', month: '本月戰績', quarter: '本季戰績', custom: '自訂區間' };
            document.getElementById('range-label').innerText = rangeLabels[currentRange];

            // 統計數據
            const stats = players.map(p => {
                let total = 0, count = 0;
                filtered.forEach(r => {
                    if (r.scores[p] !== undefined) { total += r.scores[p]; count++; }
                });
                return { name: p, count, total };
            }).sort((a, b) => b.total - a.total);

            // 排行榜渲染
            document.getElementById('rankingList').innerHTML = stats.map((s, idx) => {
                let icon = (idx === 0 && s.count > 0) ? '👑 ' : (idx === stats.length-1 && s.count > 0) ? '💪 ' : '';
                return `<div class="flex items-center justify-between border-b border-slate-50 pb-4 last:border-0">
                    <div class="flex items-center gap-4"><span class="text-xl font-black ${idx==0?'text-amber-400':'text-slate-200'}">${idx+1}</span>
                    <div><p class="font-black text-slate-800 text-lg">${icon}${s.name}</p><p class="text-[10px] font-bold text-slate-400 uppercase">區間出賽: ${s.count}</p></div></div>
                    <div class="text-right font-mono font-black text-2xl ${s.total >= 0 ? 'text-rose-500' : 'text-emerald-600'}">${s.total > 0 ? '+' + s.total : s.total}</div></div>`;
            }).join('');

            // 紀錄清單渲染 (倒序)
            const hList = document.getElementById('historyList');
            const sortedRecords = [...filtered].sort((a,b) => new Date(b.date.replace(/年|月/g, '-').replace(/日/g, '')) - new Date(a.date.replace(/年|月/g, '-').replace(/日/g, '')));
            hList.innerHTML = sortedRecords.length ? sortedRecords.map(r => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-50">
                    <div class="flex justify-between items-start mb-2"><span class="text-xs font-bold text-slate-400">${r.date}</span><button onclick="deleteRecord(${records.indexOf(r)})" class="text-slate-200 hover:text-rose-500 text-xs">刪除</button></div>
                    <div class="text-sm text-slate-600">${Object.entries(r.scores).map(([n, s]) => `${n}: <b class="${s>=0?'text-rose-500':'text-emerald-600'}">${s>0?'+'+s:s}</b>`).join(' ')}</div>
                </div>`).join('') : '<p class="text-center text-slate-300 py-10 text-sm">此區間暫無紀錄</p>';
        }

        // --- 基礎功能補完 ---
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active-tab'));
            document.getElementById(`${tabId}-page`).classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active-tab');
            if(tabId === 'dashboard') updateDashboard();
            if(tabId === 'admin') renderPlayerManagement();
        }

        function renderScoreInputs() {
            document.getElementById('scoreInputs').innerHTML = players.map(p => `
                <div class="bg-white p-4 rounded-2xl flex items-center shadow-sm border border-slate-50">
                    <div class="w-1/2 font-black text-slate-700 text-lg">${p}</div>
                    <div class="w-1/2"><input type="text" oninput="calculateTotal()" data-player="${p}" placeholder="-" class="score-input w-full text-right text-3xl font-mono font-black text-slate-800 bg-transparent border-none focus:ring-0"></div>
                </div>`).join('');
        }

        function calculateTotal() {
            let total = 0, count = 0;
            document.querySelectorAll('.score-input').forEach(i => { const v = i.value.trim(); if(v !== "" && v !== "-") { total += Number(v); count++; } });
            document.getElementById('totalCheck').innerText = total;
            const btn = document.getElementById('saveBtn');
            if (total === 0 && count > 0) { document.getElementById('totalCheck').className="text-4xl font-black text-emerald-500"; btn.disabled = false; }
            else { document.getElementById('totalCheck').className="text-4xl font-black text-rose-500"; btn.disabled = true; }
        }

        function saveMatch() {
            const date = document.getElementById('matchDate').value;
            const scores = {};
            document.querySelectorAll('.score-input').forEach(i => { const v = i.value.trim(); if(v !== "" && v !== "-") scores[i.dataset.player] = Number(v); });
            records.push({ date, scores });
            localStorage.setItem('mj_records', JSON.stringify(records));
            document.querySelectorAll('.score-input').forEach(i => i.value = '');
            calculateTotal();
            alert('✅ 儲存成功');
            switchTab('dashboard');
        }

        function deleteRecord(idx) { if(confirm("刪除此筆紀錄？")) { records.splice(idx, 1); localStorage.setItem('mj_records', JSON.stringify(records)); updateDashboard(); } }

        function importFromExcel(event) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                if (jsonData.length > 0) {
                    records = jsonData.map(row => {
                        let scores = {};
                        Object.keys(row).forEach(k => { if(k !== "日期" && k !== "Date" && k !== "Total" && row[k] !== "-") scores[k] = Number(row[k]); });
                        return { date: (row["日期"] || row["Date"]).toString().replace(/年|月/g, '-').replace(/日/g, ''), scores };
                    });
                    localStorage.setItem('mj_records', JSON.stringify(records));
                    location.reload();
                }
            };
            reader.readAsArrayBuffer(event.target.files[0]);
        }

        function exportExcel() {
            const data = records.map(r => { let row = { "日期": r.date }; players.forEach(p => row[p] = r.scores[p] ?? "-"); return row; });
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "MJ_Data");
            XLSX.writeFile(wb, "Mahjong_Records.xlsx");
        }

        function renderPlayerManagement() {
            document.getElementById('playerManagementList').innerHTML = players.map((p, i) => `<div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl mb-2"><span class="font-bold">${p}</span><button onclick="removePlayer(${i})" class="text-rose-400 text-sm">移除</button></div>`).join('');
            localStorage.setItem('mj_players', JSON.stringify(players));
        }

        function addPlayer() { const n = document.getElementById('newPlayerName').value.trim(); if(n && !players.includes(n)) { players.push(n); document.getElementById('newPlayerName').value=''; renderPlayerManagement(); renderScoreInputs(); } }
        function removePlayer(i) { if(confirm("移除成員？")) { players.splice(i, 1); renderPlayerManagement(); renderScoreInputs(); } }
        function exportImage() { html2canvas(document.getElementById('dashboardCard'), { scale: 2 }).then(canvas => { const a = document.createElement('a'); a.download = '戰報.png'; a.href = canvas.toDataURL(); a.click(); }); }
        function clearData() { if(confirm("確定全部清空？")) { localStorage.clear(); location.reload(); } }
    </script>
</body>
</html>
