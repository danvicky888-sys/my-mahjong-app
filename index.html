<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>麻將戰績紀錄</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .score-card { transition: all 0.2s; border: 2px solid transparent; }
        .score-card:focus-within { border-color: #10b981; background-color: #f0fdf4; }
        input[type="number"] { -moz-appearance: textfield; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="p-4">

    <div class="max-w-md mx-auto">
        <header class="flex justify-between items-end mb-6">
            <div>
                <h1 class="text-2xl font-black text-slate-800">🀄 快速記帳</h1>
                <p class="text-slate-500 text-xs">成員已固定，直接輸入即可</p>
            </div>
            <input type="date" id="matchDate" class="text-sm border-none bg-transparent font-bold text-slate-600">
        </header>

        <div id="scoreInputs" class="space-y-3 mb-6">
            </div>

        <div class="sticky bottom-4">
            <div class="card bg-white p-5 rounded-3xl shadow-2xl border border-slate-100">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-slate-500 font-medium">加總檢查</span>
                    <span id="totalCheck" class="text-3xl font-black text-rose-500">0</span>
                </div>
                
                <button onclick="saveMatch()" id="saveBtn" class="w-full bg-slate-800 text-white py-4 rounded-2xl font-bold text-lg shadow-lg active:scale-95 transition disabled:bg-slate-200 disabled:text-slate-400 disabled:shadow-none" disabled>
                    儲存本局成績
                </button>
            </div>
        </div>

        <section id="dashboard" class="mt-10 bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-black text-slate-800">📊 戰績排行榜</h2>
                <button onclick="exportImage()" class="text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-full">分享圖片</button>
            </div>
            <div class="space-y-4" id="rankingList">
                </div>
        </section>

        <div class="mt-8 flex justify-center gap-6 pb-10">
            <button onclick="exportExcel()" class="text-slate-400 text-sm hover:text-blue-500">📥 匯出 Excel</button>
            <button onclick="toggleAdmin()" class="text-slate-400 text-sm hover:text-slate-600">⚙️ 管理人員</button>
        </div>

        <div id="adminPanel" class="hidden fixed inset-0 bg-white z-50 p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">管理參賽名單</h2>
                <button onclick="toggleAdmin()" class="text-2xl">&times;</button>
            </div>
            <div class="flex gap-2 mb-4">
                <input type="text" id="newPlayerName" placeholder="姓名" class="flex-1 border p-3 rounded-xl">
                <button onclick="addPlayer()" class="bg-slate-800 text-white px-6 rounded-xl">新增</button>
            </div>
            <div id="playerManagementList" class="space-y-2"></div>
            <button onclick="clearData()" class="mt-10 w-full text-rose-500 text-sm border border-rose-100 py-3 rounded-xl">清除所有歷史紀錄</button>
        </div>
    </div>

    <script>
        const DEFAULT_PLAYERS = ["Daniel", "Ken", "Roger", "CK", "Totoron", "Host"];
        let players = JSON.parse(localStorage.getItem('mj_players')) || DEFAULT_PLAYERS;
        let records = JSON.parse(localStorage.getItem('mj_records')) || [];

        window.onload = () => {
            document.getElementById('matchDate').valueAsDate = new Date();
            renderScoreInputs();
            updateDashboard();
        };

        function renderScoreInputs() {
            const container = document.getElementById('scoreInputs');
            container.innerHTML = players.map(p => `
                <div class="score-card bg-white p-4 rounded-2xl flex items-center shadow-sm">
                    <div class="w-1/3">
                        <span class="block font-black text-slate-700">${p}</span>
                        <button onclick="startVoice('${p}')" class="text-xs text-slate-400 flex items-center gap-1 mt-1">
                            <span class="text-lg">🎤</span> 語音
                        </button>
                    </div>
                    <div class="w-2/3">
                        <input type="number" step="1" placeholder="輸入分數" 
                            oninput="calculateTotal()" 
                            data-player="${p}" 
                            class="score-input w-full text-right text-2xl font-mono font-bold text-slate-800 bg-transparent border-none focus:ring-0">
                    </div>
                </div>
            `).join('');
        }

        function calculateTotal() {
            const inputs = document.querySelectorAll('.score-input');
            let total = 0;
            let hasValue = false;
            inputs.forEach(input => {
                if(input.value !== "") {
                    total += Number(input.value);
                    hasValue = true;
                }
            });
            
            const display = document.getElementById('totalCheck');
            const saveBtn = document.getElementById('saveBtn');
            display.innerText = total;

            if (total === 0 && hasValue) {
                display.className = "text-3xl font-black text-emerald-500";
                saveBtn.disabled = false;
            } else {
                display.className = "text-3xl font-black text-rose-500";
                saveBtn.disabled = true;
            }
        }

        function saveMatch() {
            const date = document.getElementById('matchDate').value;
            const scores = {};
            document.querySelectorAll('.score-input').forEach(input => {
                scores[input.dataset.player] = Number(input.value || 0);
            });

            records.push({ date, scores });
            localStorage.setItem('mj_records', JSON.stringify(records));
            
            document.querySelectorAll('.score-input').forEach(i => i.value = '');
            calculateTotal();
            updateDashboard();
            alert('✅ 紀錄成功！');
        }

        function updateDashboard() {
            const currentYear = new Date().getFullYear();
            const currentQuarter = Math.ceil((new Date().getMonth() + 1) / 3);
            
            const stats = players.map(p => {
                let yearly = 0, quarterly = 0, count = 0;
                records.forEach(r => {
                    const rDate = new Date(r.date);
                    const rScore = r.scores[p] || 0;
                    if (rDate.getFullYear() === currentYear && rScore !== 0) {
                        yearly += rScore;
                        count++;
                        if (Math.ceil((rDate.getMonth() + 1) / 3) === currentQuarter) {
                            quarterly += rScore;
                        }
                    }
                });
                return { name: p, count, yearly, quarterly };
            });

            stats.sort((a, b) => b.yearly - a.yearly);

            const list = document.getElementById('rankingList');
            list.innerHTML = stats.map((s, idx) => `
                <div class="flex items-center justify-between p-2">
                    <div class="flex items-center gap-3">
                        <span class="text-lg font-black ${idx < 3 ? 'text-amber-500' : 'text-slate-300'}">${idx + 1}</span>
                        <div>
                            <p class="font-bold text-slate-800">${s.name}</p>
                            <p class="text-[10px] text-slate-400">出賽 ${s.count} 次 / 本季 ${s.quarterly}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="font-mono font-black text-xl ${s.yearly >= 0 ? 'text-rose-500' : 'text-emerald-600'}">
                            ${s.yearly > 0 ? '+' + s.yearly : s.yearly}
                        </p>
                    </div>
                </div>
            `).join('');
        }

        // 管理員功能
        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            panel.classList.toggle('hidden');
            renderPlayerManagement();
        }

        function renderPlayerManagement() {
            const list = document.getElementById('playerManagementList');
            list.innerHTML = players.map((p, i) => `
                <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl">
                    <span class="font-bold">${p}</span>
                    <button onclick="removePlayer(${i})" class="text-rose-500 font-bold">刪除</button>
                </div>
            `).join('');
            localStorage.setItem('mj_players', JSON.stringify(players));
        }

        function addPlayer() {
            const name = document.getElementById('newPlayerName').value.trim();
            if (name && !players.includes(name)) {
                players.push(name);
                document.getElementById('newPlayerName').value = '';
                renderPlayerManagement();
                renderScoreInputs();
                updateDashboard();
            }
        }

        function removePlayer(index) {
            players.splice(index, 1);
            renderPlayerManagement();
            renderScoreInputs();
            updateDashboard();
        }

        function startVoice(playerName) {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'zh-TW';
            recognition.start();
            recognition.onresult = (event) => {
                let score = parseInt(event.results[0][0].transcript.replace(/[^0-9-]/g, ''));
                if (!isNaN(score)) {
                    document.querySelector(`input[data-player="${playerName}"]`).value = score;
                    calculateTotal();
                }
            };
        }

        function exportExcel() {
            const wsData = records.map(r => ({ "日期": r.date, ...r.scores }));
            const ws = XLSX.utils.json_to_sheet(wsData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "戰績");
            XLSX.writeFile(wb, "MJ_Rank.xlsx");
        }

        function exportImage() {
            html2canvas(document.getElementById('dashboard'), { backgroundColor: "#ffffff", scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = '戰績報表.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        function clearData() {
            if(confirm("確定刪除所有歷史紀錄？")) {
                localStorage.removeItem('mj_records');
                location.reload();
            }
        }
    </script>
</body>
</html>
