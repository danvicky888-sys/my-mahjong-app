<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>麻將戰績紀錄 v11.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .active-tab { border-bottom: 4px solid #10b981; color: #10b981; font-weight: 900; }
        .filter-btn { border: 1px solid #e2e8f0; background: white; }
        .filter-btn.active { background-color: #10b981 !important; color: white !important; border-color: #10b981 !important; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; padding: 15px; }
        .modal.active { display: flex; }
        .recording { animation: pulse 1s infinite; background-color: #ef4444 !important; color: white !important; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="pb-24">

    <div id="shareModal" class="modal">
        <div class="bg-white rounded-[2rem] p-6 w-full max-w-sm">
            <div id="shareContent" class="bg-white p-4 rounded-xl">
                <h3 id="shareTitle" class="text-xl font-black text-center mb-6 text-slate-800">戰報</h3>
                <div class="h-80 mb-4">
                    <canvas id="singleMatchChart"></canvas>
                </div>
                <p class="text-[10px] text-center text-slate-300 font-bold uppercase">Mahjong Tracker Record</p>
            </div>
            <div class="flex gap-2 mt-6">
                <button onclick="downloadShareImg()" class="flex-1 bg-emerald-500 text-white py-4 rounded-2xl font-black">保存圖片</button>
                <button onclick="closeModal()" class="px-6 bg-slate-100 text-slate-400 py-4 rounded-2xl font-bold">關閉</button>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 flex z-50 shadow-2xl">
        <button onclick="switchTab('dashboard')" id="tab-dashboard" class="flex-1 py-5 active-tab">📊 戰報</button>
        <button onclick="switchTab('record')" id="tab-record" class="flex-1 py-5 text-slate-400">📝 紀錄</button>
        <button onclick="switchTab('admin')" id="tab-admin" class="flex-1 py-5 text-slate-400">⚙️ 管理</button>
    </nav>

    <div class="max-w-4xl mx-auto p-4">
        
        <section id="dashboard-page" class="tab-content active">
            <h1 class="text-2xl font-black text-slate-800 mb-4">累積成績</h1>
            
            <div class="bg-white rounded-2xl p-3 shadow-sm mb-4 flex gap-2 overflow-x-auto border border-slate-100">
                <button onclick="updateRange('all')" id="btn-all" class="filter-btn flex-shrink-0 px-4 py-2 text-xs font-bold rounded-full active">全部</button>
                <button onclick="updateRange('month')" id="btn-month" class="filter-btn flex-shrink-0 px-4 py-2 text-xs font-bold rounded-full">本月</button>
                <button onclick="updateRange('quarter')" id="btn-quarter" class="filter-btn flex-shrink-0 px-4 py-2 text-xs font-bold rounded-full">本季</button>
                <button onclick="updateRange('year')" id="btn-year" class="filter-btn flex-shrink-0 px-4 py-2 text-xs font-bold rounded-full">年度</button>
                <button onclick="toggleCustomRange()" id="btn-custom" class="filter-btn flex-shrink-0 px-4 py-2 text-xs font-bold rounded-full">自訂</button>
            </div>

            <div id="custom-date-box" class="hidden bg-white p-3 rounded-2xl mb-4 border border-slate-100 flex gap-2">
                <input type="date" id="start-d" class="flex-1 text-xs border p-2 rounded-lg" onchange="updateDashboard()">
                <input type="date" id="end-d" class="flex-1 text-xs border p-2 rounded-lg" onchange="updateDashboard()">
            </div>

            <div class="bg-white rounded-[2rem] p-4 shadow-sm mb-6 h-64 border border-slate-100">
                <canvas id="barChart"></canvas>
            </div>
            <div id="rankingList" class="space-y-3 mb-8"></div>

            <h2 class="text-lg font-black mb-4 px-2">📋 歷史明細 <span class="text-[10px] font-normal text-slate-400 ml-2">(點擊日期分享)</span></h2>
            <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="bg-slate-50 border-b">
                            <tr id="tableHeader"></tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-slate-50"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="record-page" class="tab-content">
            <div class="flex justify-between items-center mb-6"><h1 class="text-2xl font-black">記帳紀錄</h1><input type="date" id="matchDate" class="border rounded-xl px-2 py-1 font-bold text-sm"></div>
            <div id="scoreInputs" class="space-y-3 mb-6"></div>
            <div class="bg-slate-900 p-8 rounded-[2.5rem] text-white shadow-2xl">
                <div class="flex justify-between items-center">
                    <div><p class="text-[10px] opacity-40 font-bold">CALCULATION</p><p class="text-4xl font-black" id="totalCheck">0</p></div>
                    <button onclick="saveMatch()" id="saveBtn" disabled class="bg-emerald-500 px-10 py-4 rounded-2xl font-black text-lg disabled:opacity-20 shadow-lg">儲存戰績</button>
                </div>
            </div>
        </section>

        <section id="admin-page" class="tab-content">
            <h1 class="text-2xl font-black mb-6">成員管理</h1>
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 mb-6">
                <div id="memberList" class="space-y-2 mb-4"></div>
                <div class="flex gap-2">
                    <input type="text" id="newMemberName" placeholder="新成員" class="flex-1 bg-slate-50 p-4 rounded-xl">
                    <button onclick="addMember()" class="bg-slate-800 text-white px-8 rounded-xl font-bold">新增</button>
                </div>
            </div>
            <button onclick="clearData()" class="w-full text-slate-300 text-xs">清空數據</button>
        </section>
    </div>

    <script>
        // 核心資料庫
        let players = JSON.parse(localStorage.getItem('mj_players')) || ["Daniel", "Ken", "Roger", "CK", "Totoron", "Host"];
        let records = JSON.parse(localStorage.getItem('mj_records')) || [];
        let currentRange = 'all';
        let charts = { main: null, single: null };

        // --- 語音功能重構 (使用更穩定的啟動方式) ---
        function startVoice(p) {
            const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!Speech) return alert("您的設備目前不支援語音功能，請檢查是否在 Chrome 或 Safari 中開啟。");
            
            const recognition = new Speech();
            recognition.lang = 'zh-TW';
            recognition.continuous = false;
            recognition.interimResults = false;

            const btn = document.getElementById(`vbtn-${p}`);
            recognition.onstart = () => btn.classList.add('recording');
            recognition.onend = () => btn.classList.remove('recording');
            
            recognition.onresult = (event) => {
                let text = event.results[0][0].transcript;
                let value = text.replace(/負/g, '-').replace(/萬/g, '0000').replace(/千/g, '000').replace(/[^0-9-]/g, '');
                if (value) {
                    const input = document.querySelector(`input[data-player="${p}"]`);
                    input.value = parseInt(value);
                    calculateTotal();
                }
            };
            recognition.onerror = () => btn.classList.remove('recording');
            recognition.start();
        }

        // --- 區間篩選修復 ---
        function updateRange(r) {
            currentRange = r;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${r}`).classList.add('active');
            document.getElementById('custom-date-box').classList.add('hidden');
            updateDashboard();
        }

        function toggleCustomRange() {
            currentRange = 'custom';
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-custom').classList.add('active');
            document.getElementById('custom-date-box').classList.toggle('hidden');
        }

        function getFilteredRecords() {
            const now = new Date();
            return records.filter(r => {
                const d = new Date(r.date.replace(/年|月|日/g, '-'));
                if (currentRange === 'month') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                if (currentRange === 'quarter') return Math.ceil((d.getMonth()+1)/3) === Math.ceil((now.getMonth()+1)/3) && d.getFullYear() === now.getFullYear();
                if (currentRange === 'year') return d.getFullYear() === now.getFullYear();
                if (currentRange === 'custom') {
                    const s = document.getElementById('start-d').value;
                    const e = document.getElementById('end-d').value;
                    return (!s || d >= new Date(s)) && (!e || d <= new Date(e));
                }
                return true;
            });
        }

        // --- 排行與圖表 ---
        function updateDashboard() {
            const filtered = getFilteredRecords();
            renderMainChart(filtered);
            renderLeaderboard(filtered);
            renderTable(filtered);
        }

        function renderMainChart(f) {
            const ctx = document.getElementById('barChart');
            if (charts.main) charts.main.destroy();
            const stats = players.map(p => {
                let t = 0; f.forEach(r => { let v = r.scores[p]; if(v && v !== "-") t += parseInt(v); });
                return { name: p, total: t };
            });
            charts.main = new Chart(ctx, {
                type: 'bar',
                data: { labels: stats.map(s => s.name), datasets: [{ data: stats.map(s => s.total), backgroundColor: stats.map(s => s.total>=0?'#fb7185':'#34d399'), borderRadius: 12 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        function renderTable(f) {
            document.getElementById('tableHeader').innerHTML = `<th class="p-4 text-left">日期</th>` + players.map(p => `<th class="p-2 text-[10px] text-slate-400">${p}</th>`).join('') + `<th></th>`;
            document.getElementById('tableBody').innerHTML = [...f].reverse().map(r => {
                const idx = records.indexOf(r);
                return `<tr>
                    <td onclick="showSingleMatch(${idx})" class="p-4 font-black text-emerald-600 underline cursor-pointer">${r.date}</td>
                    ${players.map(p => {
                        const s = r.scores[p]; const isAbs = (s === undefined || s === "" || s === "-");
                        return `<td class="p-2 font-mono text-xs ${isAbs?'text-slate-200':(s>0?'text-rose-500':'text-emerald-600')}">${isAbs?'-':s}</td>`;
                    }).join('')}
                    <td class="p-4"><button onclick="deleteRecord(${idx})" class="text-slate-100">×</button></td>
                </tr>`;
            }).join('');
        }

        function renderScoreInputs() {
            document.getElementById('scoreInputs').innerHTML = players.map(p => `
                <div class="bg-white p-5 rounded-3xl flex items-center shadow-sm border border-slate-50">
                    <div class="w-1/3 font-black text-slate-700">${p}</div>
                    <div class="w-1/3 text-center"><button onclick="startVoice('${p}')" id="vbtn-${p}" class="voice-btn text-[10px] bg-slate-50 px-4 py-1 rounded-full text-emerald-500 font-black border">🎤 語音</button></div>
                    <div class="w-1/3"><input type="text" oninput="calculateTotal()" data-player="${p}" placeholder="-" class="score-input w-full text-right text-2xl font-mono font-black bg-transparent"></div>
                </div>`).join('');
        }

        function calculateTotal() {
            let t = 0, c = 0; document.querySelectorAll('.score-input').forEach(i => { const v = i.value.trim(); if(v && v !== "-"){t += parseInt(v); c++;} });
            const d = document.getElementById('totalCheck'); d.innerText = t; d.className = (t===0)?"text-4xl font-black text-emerald-400":"text-4xl font-black text-rose-400";
            document.getElementById('saveBtn').disabled = !(t===0 && c>0);
        }

        function saveMatch() {
            const s = {}; document.querySelectorAll('.score-input').forEach(i => { const v = i.value.trim(); s[i.dataset.player] = (v===""||v==="-")?"-":parseInt(v); });
            records.push({ date: document.getElementById('matchDate').value, scores: s });
            localStorage.setItem('mj_records', JSON.stringify(records));
            location.reload();
        }

        // --- 分享圖彈窗 ---
        function showSingleMatch(idx) {
            const r = records[idx];
            document.getElementById('shareTitle').innerText = `🏆 戰報 ${r.date}`;
            document.getElementById('shareModal').classList.add('active');
            const attendees = Object.keys(r.scores).filter(n => r.scores[n] !== "" && r.scores[n] !== "-");
            const scores = attendees.map(n => r.scores[n]);
            const ctx = document.getElementById('singleMatchChart').getContext('2d');
            if (charts.single) charts.single.destroy();
            charts.single = new Chart(ctx, {
                type: 'bar',
                data: { labels: attendees, datasets: [{ data: scores, backgroundColor: scores.map(v => v>=0?'#fb7185':'#34d399'), borderRadius: 10, barThickness: 25 }] },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { grid: { display: false } } }
                }
            });
        }

        function downloadShareImg() {
            html2canvas(document.getElementById('shareContent'), { scale: 3 }).then(canvas => {
                const a = document.createElement('a'); a.download = `戰績分享.png`; a.href = canvas.toDataURL('image/png'); a.click();
            });
        }

        function switchTab(t) {
            document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(e => e.classList.add('text-slate-400'));
            document.getElementById(`${t}-page`).classList.add('active');
            document.getElementById(`tab-${t}`).classList.remove('text-slate-400');
            if(t==='admin') renderMemberList();
            updateDashboard();
        }

        function renderMemberList() {
            document.getElementById('memberList').innerHTML = players.map((p, i) => `
                <div class="flex justify-between items-center p-4 bg-slate-50 rounded-2xl">
                    <span class="font-black text-slate-700">${p}</span>
                    <button onclick="removeMember(${i})" class="text-rose-400 font-bold">移除</button>
                </div>`).join('');
            localStorage.setItem('mj_players', JSON.stringify(players));
        }

        function addMember() { const n = document.getElementById('newMemberName').value.trim(); if(n){players.push(n); document.getElementById('newMemberName').value=''; renderMemberList(); renderScoreInputs();} }
        function removeMember(i) { players.splice(i,1); renderMemberList(); renderScoreInputs(); }
        function closeModal() { document.getElementById('shareModal').classList.remove('active'); }
        function deleteRecord(idx) { if(confirm("刪除？")) { records.splice(idx,1); localStorage.setItem('mj_records', JSON.stringify(records)); updateDashboard(); } }
        function clearData() { if(confirm("確定清空？")) { localStorage.clear(); location.reload(); } }

        window.onload = () => {
            document.getElementById('matchDate').valueAsDate = new Date();
            renderScoreInputs();
            updateDashboard();
        };
    </script>
</body>
</html>
