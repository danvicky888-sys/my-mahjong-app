<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻將競技紀錄戰情室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background: #f3f4f6; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="p-4 pb-20">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-center text-green-700 mb-6">🀄 麻將競技紀錄戰情室</h1>

        <section class="card p-6 mb-6">
            <h2 class="text-xl font-bold mb-4 border-b pb-2">👥 參賽名單 (最多8人)</h2>
            <div id="playerList" class="flex flex-wrap gap-2 mb-4">
                </div>
            <div class="flex gap-2">
                <input type="text" id="newPlayerName" placeholder="輸入姓名" class="border p-2 rounded flex-1">
                <button onclick="addPlayer()" class="bg-green-600 text-white px-4 py-2 rounded">＋ 新增</button>
            </div>
        </section>

        <section class="card p-6 mb-6">
            <h2 class="text-xl font-bold mb-4 border-b pb-2">📝 本局紀錄</h2>
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm text-gray-600">日期</label>
                    <input type="date" id="matchDate" class="w-full border p-2 rounded">
                </div>
            </div>
            <div id="scoreInputs" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                </div>
            <div class="mt-6 p-4 bg-gray-50 rounded-lg flex justify-between items-center">
                <div>
                    <span class="text-lg">加總檢查：</span>
                    <span id="totalCheck" class="text-xl font-bold text-red-600">0</span>
                </div>
                <button onclick="saveMatch()" id="saveBtn" class="bg-blue-600 text-white px-8 py-2 rounded-lg font-bold opacity-50 cursor-not-allowed" disabled>確認存檔</button>
            </div>
        </section>

        <section id="dashboard" class="card p-6 mb-6 bg-white">
            <h2 class="text-xl font-bold mb-4 border-b pb-2 flex justify-between">
                📊 年度戰績排行榜
                <button onclick="exportImage()" class="text-sm bg-gray-200 px-2 py-1 rounded text-gray-700">📸 分享圖片</button>
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-gray-100">
                            <th class="p-2">選手</th>
                            <th class="p-2">參賽次數</th>
                            <th class="p-2">年度總分</th>
                            <th class="p-2">本季分數</th>
                        </tr>
                    </thead>
                    <tbody id="rankingTable">
                        </tbody>
                </table>
            </div>
        </section>

        <div class="flex gap-4">
            <button onclick="exportExcel()" class="flex-1 bg-emerald-700 text-white py-3 rounded-xl font-bold">📥 匯出 Excel 表格</button>
            <button onclick="clearData()" class="bg-red-100 text-red-600 px-4 py-3 rounded-xl text-sm">清除所有資料</button>
        </div>
    </div>

    <script>
        let players = JSON.parse(localStorage.getItem('mj_players')) || ["玩家A", "玩家B", "玩家C", "玩家D"];
        let records = JSON.parse(localStorage.getItem('mj_records')) || [];

        // 初始化
        window.onload = () => {
            document.getElementById('matchDate').valueAsDate = new Date();
            renderPlayers();
            renderScoreInputs();
            updateDashboard();
        };

        // 人員管理
        function renderPlayers() {
            const container = document.getElementById('playerList');
            container.innerHTML = players.map((p, i) => `
                <span class="bg-green-100 text-green-800 px-3 py-1 rounded-full flex items-center">
                    ${p} <button onclick="removePlayer(${i})" class="ml-2 font-bold">&times;</button>
                </span>
            `).join('');
            localStorage.setItem('mj_players', JSON.stringify(players));
            renderScoreInputs();
        }

        function addPlayer() {
            const name = document.getElementById('newPlayerName').value.trim();
            if (name && players.length < 8) {
                players.push(name);
                document.getElementById('newPlayerName').value = '';
                renderPlayers();
            } else if (players.length >= 8) {
                alert("最多只能 8 個人喔！");
            }
        }

        function removePlayer(index) {
            players.splice(index, 1);
            renderPlayers();
        }

        // 分數輸入與語音
        function renderScoreInputs() {
            const container = document.getElementById('scoreInputs');
            container.innerHTML = players.map(p => `
                <div class="flex items-center gap-2 p-2 border rounded">
                    <span class="w-16 font-bold truncate">${p}</span>
                    <input type="number" step="10" placeholder="分數" oninput="calculateTotal()" 
                        data-player="${p}" class="score-input flex-1 p-1 border-b">
                    <button onclick="startVoice('${p}')" class="text-xl">🎤</button>
                </div>
            `).join('');
        }

        // 語音輸入邏輯
        function startVoice(playerName) {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'zh-TW';
            recognition.start();
            recognition.onresult = (event) => {
                let text = event.results[0][0].transcript;
                let score = parseInt(text.replace(/[^0-9-]/g, ''));
                if (!isNaN(score)) {
                    document.querySelector(`input[data-player="${playerName}"]`).value = score;
                    calculateTotal();
                }
            };
        }

        // 自動加總校驗
        function calculateTotal() {
            const inputs = document.querySelectorAll('.score-input');
            let total = 0;
            inputs.forEach(input => total += Number(input.value || 0));
            
            const display = document.getElementById('totalCheck');
            const saveBtn = document.getElementById('saveBtn');
            display.innerText = total;

            if (total === 0 && inputs.length > 0) {
                display.className = "text-xl font-bold text-green-600";
                saveBtn.disabled = false;
                saveBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                display.className = "text-xl font-bold text-red-600";
                saveBtn.disabled = true;
                saveBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }

        // 存檔
        function saveMatch() {
            const date = document.getElementById('matchDate').value;
            const scores = {};
            document.querySelectorAll('.score-input').forEach(input => {
                scores[input.dataset.player] = Number(input.value || 0);
            });

            records.push({ date, scores });
            localStorage.setItem('mj_records', JSON.stringify(records));
            alert('紀錄成功！');
            updateDashboard();
            // 重置輸入
            document.querySelectorAll('.score-input').forEach(i => i.value = '');
            calculateTotal();
        }

        // 季度計算邏輯
        function getQuarter(dateStr) {
            const month = new Date(dateStr).getMonth() + 1;
            return Math.ceil(month / 3);
        }

        // 更新數據看板
        function updateDashboard() {
            const currentYear = new Date().getFullYear();
            const currentQuarter = getQuarter(new Date());
            
            const stats = players.map(p => {
                let yearlySum = 0;
                let quarterlySum = 0;
                let count = 0;

                records.forEach(r => {
                    const rDate = new Date(r.date);
                    if (rDate.getFullYear() === currentYear && r.scores[p] !== undefined) {
                        yearlySum += r.scores[p];
                        count++;
                        if (getQuarter(r.date) === currentQuarter) {
                            quarterlySum += r.scores[p];
                        }
                    }
                });
                return { name: p, count, yearlySum, quarterlySum };
            });

            // 排序 (按年度總分)
            stats.sort((a, b) => b.yearlySum - a.yearlySum);

            const tbody = document.getElementById('rankingTable');
            tbody.innerHTML = stats.map(s => `
                <tr class="border-b">
                    <td class="p-2 font-bold">${s.name}</td>
                    <td class="p-2">${s.count} 次</td>
                    <td class="p-2 ${s.yearlySum >= 0 ? 'text-red-600' : 'text-green-700'}">${s.yearlySum}</td>
                    <td class="p-2 text-sm text-gray-500">${s.quarterlySum}</td>
                </tr>
            `).join('');
        }

        // 匯出 Excel
        function exportExcel() {
            const wsData = records.map(r => ({
                "日期": r.date,
                ...r.scores
            }));
            const ws = XLSX.utils.json_to_sheet(wsData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "戰績紀錄");
            XLSX.writeFile(wb, `麻將戰績_${new Date().toLocaleDateString()}.xlsx`);
        }

        // 產出圖片報表
        function exportImage() {
            const element = document.getElementById('dashboard');
            html2canvas(element).then(canvas => {
                const link = document.createElement('a');
                link.download = `年度報表_${new Date().toISOString().slice(0,10)}.png`;
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        function clearData() {
            if(confirm("確定要刪除所有紀錄嗎？此動作無法復原。")) {
                localStorage.clear();
                location.reload();
            }
        }
    </script>
</body>
</html>
