<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>麻將戰績紀錄 v11.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .active-tab { border-bottom: 4px solid #10b981; color: #10b981; font-weight: 900; }
        .filter-btn.active { background-color: #10b981; color: white; border-color: #10b981; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="pb-24">

    <div id="shareModal" class="modal">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm relative">
            <div id="shareContent" class="bg-white p-4 rounded-xl">
                <h3 id="shareTitle" class="text-xl font-black text-center mb-4 text-slate-800"></h3>
                <div class="h-64 mb-4">
                    <canvas id="singleMatchChart"></canvas>
                </div>
                <p class="text-[10px] text-center text-slate-400">Generated by Mahjong Tracker</p>
            </div>
            <div class="flex gap-2 mt-4">
                <button onclick="downloadShareImg()" class="flex-1 bg-emerald-500 text-white py-3 rounded-xl font-bold">保存圖片分享 Line</button>
                <button onclick="closeModal()" class="flex-1 bg-slate-100 text-slate-500 py-3 rounded-xl font-bold">關閉</button>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex z-50 shadow-lg">
        <button onclick="switchTab('dashboard')" id="tab-dashboard" class="flex-1 py-4 active-tab">📊 戰報</button>
        <button onclick="switchTab('record')" id="tab-record" class="flex-1 py-4 text-slate-400">📝 紀錄</button>
        <button onclick="switchTab('admin')" id="tab-admin" class="flex-1 py-4 text-slate-400">⚙️ 管理</button>
    </nav>

    <div class="max-w-4xl mx-auto p-4">
        
        <section id="dashboard-page" class="tab-content active">
            <h1 class="text-2xl font-black mb-4">戰績數據</h1>
            <div class="bg-white rounded-2xl p-3 shadow-sm mb-4">
                <div class="flex gap-2 overflow-x-auto">
                    <button onclick="setDateRange('all')" id="range-all" class="filter-btn px-4 py-1 text-xs font-bold rounded-full active border">全部</button>
                    <button onclick="setDateRange('month')" id="range-month" class="filter-btn px-4 py-1 text-xs font-bold rounded-full border">本月</button>
                    <button onclick="setDateRange('year')" id="range-year" class="filter-btn px-4 py-1 text-xs font-bold rounded-full border">年度</button>
                </div>
            </div>
            <div class="bg-white rounded-3xl p-4 shadow-sm mb-6 h-64 border border-slate-50">
                <canvas id="barChart"></canvas>
            </div>
            <div id="rankingList" class="space-y-3 mb-8"></div>

            <h2 class="text-lg font-black mb-3 px-2 flex justify-between items-center">
                <span>📋 歷史明細</span>
                <span class="text-[10px] text-emerald-500 font-bold">點擊日期分享單次圖 ➔</span>
            </h2>
            <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm">
                        <thead class="bg-slate-50 border-b">
                            <tr id="tableHeader"></tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="record-page" class="tab-content">
            <div class="flex justify-between items-center mb-6"><h1 class="text-2xl font-black">新增紀錄</h1><input type="date" id="matchDate" class="border rounded p-1 text-sm"></div>
            <p class="text-[10px] text-slate-400 mb-4 px-2">* 輸入數字紀錄成績，未出席請輸入 "-" 或留空</p>
            <div id="scoreInputs" class="space-y-3 mb-6"></div>
            <div class="bg-slate-900 p-6 rounded-3xl text-white shadow-xl">
                <div class="flex justify-between items-center mb-4"><span>校驗: <span id="totalCheck" class="text-2xl font-black">0</span></span><button onclick="saveMatch()" id="saveBtn" disabled class="bg-emerald-500 px-8 py-2 rounded-xl font-bold disabled:opacity-30">儲存</button></div>
            </div>
        </section>

        <section id="admin-page" class="tab-content">
            <h1 class="text-2xl font-black mb-6">成員管理</h1>
            <div class="bg-white p-5 rounded-3xl shadow-sm border mb-6">
                <div id="memberList" class="space-y-2 mb-4"></div>
                <div class="flex gap-2">
                    <input type="text" id="newMemberName" placeholder="輸入姓名" class="flex-1 bg-slate-50 p-3 rounded-xl border">
                    <button onclick="addMember()" class="bg-slate-800 text-white px-6 rounded-xl font-black">＋</button>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="exportExcel()" class="bg-white border p-4 rounded-2xl font-bold">📤 匯出備份</button>
                <button onclick="clearData()" class="bg-white border p-4 rounded-2xl font-bold text-rose-500">🗑️ 清空紀錄</button>
            </div>
        </section>
    </div>

    <script>
        let players = JSON.parse(localStorage.getItem('mj_players')) || ["Daniel", "Ken", "Roger", "CK", "Totoron", "Host"];
        let records = JSON.parse(localStorage.getItem('mj_records')) || [];
        let currentRange = 'all';
        let charts = { main: null, single: null };

        // --- 成員管理 ---
        function renderMemberList() {
            const list = document.getElementById('memberList');
            list.innerHTML = players.map((p, i) => `
                <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-100">
                    <span class="font-bold text-slate-700">${p}</span>
                    <button onclick="removeMember(${i})" class="text-rose-400 text-xs font-bold">移除</button>
                </div>
            `).join('');
            localStorage.setItem('mj_players', JSON.stringify(players));
            renderScoreInputs();
        }
        function addMember() {
            const name = document.getElementById('newMemberName').value.trim();
            if (name && !players.includes(name)) { players.push(name); document.getElementById('newMemberName').value = ''; renderMemberList(); }
        }
        function removeMember(i) { if(confirm(`確定移除 ${players[i]}？歷史紀錄將保留但不再出現於新增清單。`)) { players.splice(i, 1); renderMemberList(); } }

        // --- 單次戰績分享邏輯 ---
        function showSingleMatch(idx) {
            const r = records[idx];
            document.getElementById('shareTitle').innerText = `戰績速報 ${r.date}`;
            document.getElementById('shareModal').classList.add('active');
            
            // 過濾未出席成員 (成績為空、null或"-")
            const attendees = Object.keys(r.scores).filter(name => r.scores[name] !== "" && r.scores[name] !== "-");
            const data = attendees.map(name => r.scores[name]);

            const ctx = document.getElementById('singleMatchChart').getContext('2d');
            if (charts.single) charts.single.destroy();
            charts.single = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: attendees,
                    datasets: [{
                        data: data,
                        backgroundColor: data.map(v => v >= 0 ? '#fb7185' : '#34d399'),
                        borderRadius: 6
                    }]
                },
                options: {
                    indexAxis: 'y',
                    plugins: { 
                        legend: { display: false },
                        tooltip: { enabled: false }
                    },
                    scales: { x: { grid: { display: false } } }
                }
            });
            // 在柱狀圖上顯示數值 (簡單實現)
            charts.single.options.plugins.datalabels = { display: true };
        }

        function downloadShareImg() {
            html2canvas(document.getElementById('shareContent'), { scale: 3 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `MJ_Result_${new Date().getTime()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // --- 核心邏輯 ---
        function updateDashboard() {
            const filtered = getFilteredRecords();
            renderMainChart(filtered);
            renderLeaderboard(filtered);
            renderTable(filtered);
        }

        function renderMainChart(filtered) {
            const ctx = document.getElementById('barChart');
            if (charts.main) charts.main.destroy();
            const stats = players.map(p => {
                let total = 0;
                filtered.forEach(r => { let v = r.scores[p]; if(v && v !== "-") total += parseInt(v); });
                return { name: p, total };
            });
            charts.main = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: stats.map(s => s.name),
                    datasets: [{ data: stats.map(s => s.total), backgroundColor: stats.map(s => s.total>=0 ? '#fb7185' : '#34d399'), borderRadius: 8 }]
                },
                options: { plugins: { legend: { display: false } }, responsive: true, maintainAspectRatio: false }
            });
        }

        function renderTable(filtered) {
            const header = document.getElementById('tableHeader');
            header.innerHTML = `<th class="p-3 text-left">日期</th>` + players.map(p => `<th class="p-3 text-xs">${p}</th>`).join('') + `<th></th>`;
            const body = document.getElementById('tableBody');
            body.innerHTML = [...filtered].reverse().map(r => {
                const idx = records.indexOf(r);
                return `<tr>
                    <td onclick="showSingleMatch(${idx})" class="p-3 font-bold text-emerald-600 underline cursor-pointer">${r.date}</td>
                    ${players.map(p => {
                        const s = r.scores[p];
                        const isAbsent = (s === undefined || s === "" || s === "-");
                        return `<td class="p-3 font-mono text-xs ${isAbsent ? 'text-slate-200' : (s>0?'text-rose-500':'text-emerald-600')}">${isAbsent ? '-' : s}</td>`;
                    }).join('')}
                    <td class="p-3 text-center"><button onclick="deleteRecord(${idx})" class="text-slate-300">×</button></td>
                </tr>`;
            }).join('');
        }

        function renderScoreInputs() {
            document.getElementById('scoreInputs').innerHTML = players.map(p => `
                <div class="bg-white p-4 rounded-2xl flex items-center shadow-sm border border-slate-100">
                    <div class="w-1/2 font-black text-slate-600">${p}</div>
                    <div class="w-1/2"><input type="text" oninput="calculateTotal()" data-player="${p}" placeholder="-" class="score-input w-full text-right text-2xl font-mono font-black border-none bg-transparent focus:outline-none"></div>
                </div>`).join('');
        }

        function calculateTotal() {
            let total = 0, count = 0;
            document.querySelectorAll('.score-input').forEach(i => {
                const v = i.value.trim();
                if(v && v !== "-") { total += parseInt(v); count++; }
            });
            const display = document.getElementById('totalCheck');
            display.innerText = total;
            display.className = (total === 0) ? "text-emerald-400 font-black" : "text-rose-400 font-black";
            document.getElementById('saveBtn').disabled = !(total === 0 && count > 0);
        }

        function saveMatch() {
            const scores = {};
            document.querySelectorAll('.score-input').forEach(i => { 
                const v = i.value.trim();
                scores[i.dataset.player] = (v === "" || v === "-") ? "-" : parseInt(v); 
            });
            records.push({ date: document.getElementById('matchDate').value, scores });
            localStorage.setItem('mj_records', JSON.stringify(records));
            location.reload();
        }

        function getFilteredRecords() {
            const now = new Date();
            return records.filter(r => {
                const d = new Date(r.date.replace(/年|月|日/g, '-'));
                if (currentRange === 'month') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                return true;
            });
        }

        function renderLeaderboard(f) {
            const stats = players.map(p => {
                let total = 0, count = 0;
                f.forEach(r => { if(r.scores[p] !== undefined && r.scores[p] !== "-") { total += parseInt(r.scores[p]); count++; } });
                return { name: p, total, count };
            }).sort((a,b) => b.total - a.total);
            document.getElementById('rankingList').innerHTML = stats.map((s, i) => `
                <div class="bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm border border-slate-50">
                    <div class="flex items-center gap-3"><span class="font-black text-slate-200">${i+1}</span><span class="font-black">${s.name}</span></div>
                    <div class="font-mono font-black text-lg ${s.total>=0?'text-rose-500':'text-emerald-600'}">${s.total>0?'+'+s.total:s.total}</div>
                </div>`).join('');
        }

        function setDateRange(r) { currentRange = r; updateDashboard(); }
        function switchTab(t) {
            document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(e => e.classList.add('text-slate-400'));
            document.getElementById(`${t}-page`).classList.add('active');
            document.getElementById(`tab-${t}`).classList.remove('text-slate-400');
            if(t === 'admin') renderMemberList();
            if(t === 'dashboard') updateDashboard();
        }
        function closeModal() { document.getElementById('shareModal').classList.remove('active'); }
        function deleteRecord(idx) { if(confirm("刪除？")) { records.splice(idx,1); localStorage.setItem('mj_records', JSON.stringify(records)); updateDashboard(); } }
        function clearData() { if(confirm("確定清空？")) { localStorage.clear(); location.reload(); } }

        window.onload = () => {
            document.getElementById('matchDate').valueAsDate = new Date();
            renderScoreInputs();
            updateDashboard();
        };
    </script>
</body>
</html>
