<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>麻將戰績紀錄 v10.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .active-tab { border-bottom: 4px solid #10b981; color: #10b981; font-weight: 900; }
        .filter-btn { transition: all 0.2s; border: 1px solid #e2e8f0; }
        .filter-btn.active { background-color: #10b981; color: white; border-color: #10b981; }
        .recording-pulse { animation: pulse 1s infinite; background-color: #ef4444 !important; color: white !important; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        .table-container { overflow-x: auto; }
    </style>
</head>
<body class="pb-24">

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex z-50 shadow-lg">
        <button onclick="switchTab('dashboard')" id="tab-dashboard" class="flex-1 py-4 active-tab">📊 戰報</button>
        <button onclick="switchTab('record')" id="tab-record" class="flex-1 py-4 text-slate-400">📝 紀錄</button>
        <button onclick="switchTab('admin')" id="tab-admin" class="flex-1 py-4 text-slate-400">⚙️ 管理</button>
    </nav>

    <div class="max-w-4xl mx-auto p-4">
        
        <section id="dashboard-page" class="tab-content active">
            <header class="mb-4 mt-2 flex justify-between items-center">
                <h1 class="text-2xl font-black text-slate-800">戰績分析</h1>
                <button onclick="resetPlayerFilter()" id="resetBtn" class="hidden text-xs bg-slate-200 px-3 py-1 rounded-full font-bold">重置篩選</button>
            </header>

            <div class="bg-white rounded-2xl p-3 shadow-sm border border-slate-100 mb-4">
                <div class="flex gap-2 overflow-x-auto pb-1">
                    <button onclick="setDateRange('all')" id="range-all" class="filter-btn flex-shrink-0 px-4 py-1 text-xs font-bold rounded-full active">全部</button>
                    <button onclick="setDateRange('month')" id="range-month" class="filter-btn flex-shrink-0 px-4 py-1 text-xs font-bold rounded-full">本月</button>
                    <button onclick="setDateRange('quarter')" id="range-quarter" class="filter-btn flex-shrink-0 px-4 py-1 text-xs font-bold rounded-full">本季</button>
                    <button onclick="setDateRange('year')" id="range-year" class="filter-btn flex-shrink-0 px-4 py-1 text-xs font-bold rounded-full">年度</button>
                    <button onclick="toggleCustomRange()" id="range-custom" class="filter-btn flex-shrink-0 px-4 py-1 text-xs font-bold rounded-full">自訂</button>
                </div>
                <div id="custom-range-inputs" class="hidden flex items-center gap-2 mt-2 pt-2 border-t border-dashed border-slate-100">
                    <input type="date" id="filter-start" onchange="updateDashboard()" class="flex-1 text-xs border bg-slate-50 rounded p-1">
                    <input type="date" id="filter-end" onchange="updateDashboard()" class="flex-1 text-xs border bg-slate-50 rounded p-1">
                </div>
            </div>

            <div class="bg-white rounded-3xl p-4 shadow-sm mb-4 h-64 border border-slate-100">
                <canvas id="barChart"></canvas>
            </div>

            <div id="rankingList" class="space-y-3 mb-6"></div>

            <h2 class="text-lg font-black mb-3 px-2">📋 歷史明細表</h2>
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                <div class="table-container">
                    <table class="w-full text-sm">
                        <thead class="bg-slate-50 border-b border-slate-100">
                            <tr id="tableHeader"></tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-slate-50"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <section id="record-page" class="tab-content">
            <div class="flex justify-between items-center mb-6"><h1 class="text-2xl font-black">記帳紀錄</h1><input type="date" id="matchDate" class="border rounded px-2 py-1 text-sm font-bold"></div>
            <div id="scoreInputs" class="space-y-3 mb-6"></div>
            <div class="bg-slate-900 p-6 rounded-3xl text-white shadow-xl">
                <div class="flex justify-between items-center mb-4"><span>加總校驗</span><span id="totalCheck" class="text-4xl font-black text-rose-400">0</span></div>
                <button onclick="saveMatch()" id="saveBtn" disabled class="w-full bg-emerald-500 py-4 rounded-xl font-black text-xl disabled:bg-slate-700">儲存本局</button>
            </div>
        </section>

        <section id="admin-page" class="tab-content">
            <div class="space-y-4 pt-4">
                <button onclick="exportExcel()" class="w-full bg-slate-800 text-white p-4 rounded-2xl font-bold">📤 匯出備份 (Excel)</button>
                <label class="block w-full bg-white border-2 border-slate-200 p-4 rounded-2xl font-bold text-center cursor-pointer">📥 匯入資料 (CSV)<input type="file" class="hidden" onchange="importFromExcel(event)"></label>
                <button onclick="clearData()" class="w-full text-rose-400 text-sm mt-10">🗑️ 清空所有數據</button>
            </div>
        </section>
    </div>

    <script>
        let players = JSON.parse(localStorage.getItem('mj_players')) || ["Daniel", "Ken", "Roger", "CK", "Totoron", "Host"];
        let records = JSON.parse(localStorage.getItem('mj_records')) || [];
        let currentRange = 'all';
        let focusedPlayer = null;
        let mainChart = null;

        // --- 核心：日期過濾邏輯 ---
        function setDateRange(range) {
            currentRange = range;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`range-${range}`).classList.add('active');
            document.getElementById('custom-range-inputs').classList.add('hidden');
            updateDashboard();
        }

        function toggleCustomRange() {
            document.getElementById('custom-range-inputs').classList.toggle('hidden');
            currentRange = 'custom';
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`range-custom`).classList.add('active');
        }

        function getFilteredRecords() {
            const now = new Date();
            return records.filter(r => {
                const rDate = new Date(r.date.replace(/年|月|日/g, '-'));
                if (currentRange === 'all') return true;
                if (currentRange === 'month') return rDate.getMonth() === now.getMonth() && rDate.getFullYear() === now.getFullYear();
                if (currentRange === 'quarter') return Math.ceil((rDate.getMonth()+1)/3) === Math.ceil((now.getMonth()+1)/3) && rDate.getFullYear() === now.getFullYear();
                if (currentRange === 'year') return rDate.getFullYear() === now.getFullYear();
                if (currentRange === 'custom') {
                    const s = document.getElementById('filter-start').value;
                    const e = document.getElementById('filter-end').value;
                    return (!s || rDate >= new Date(s)) && (!e || rDate <= new Date(e));
                }
            });
        }

        // --- 核心：柱狀圖渲染 ---
        function renderChart(filtered) {
            const ctx = document.getElementById('barChart');
            if (mainChart) mainChart.destroy();

            const stats = players.map(p => {
                let total = 0;
                filtered.forEach(r => { total += (r.scores[p] || 0); });
                return { name: p, total };
            });

            mainChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: stats.map(s => s.name),
                    datasets: [{
                        label: '累計成績',
                        data: stats.map(s => s.total),
                        backgroundColor: stats.map(s => s.total >= 0 ? 'rgba(244, 63, 94, 0.7)' : 'rgba(16, 185, 129, 0.7)'),
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { grid: { display: false } } }
                }
            });
        }

        // --- 修復與優化：修改功能 (原位編輯) ---
        function enterEditMode(idx) {
            const r = records[idx];
            const row = document.getElementById(`row-${idx}`);
            row.innerHTML = `
                <td class="p-2"><input type="date" id="ed-${idx}" value="${r.date}" class="border text-xs w-full"></td>
                ${players.map(p => `<td><input type="number" id="es-${idx}-${p}" value="${r.scores[p]||0}" class="border w-full p-1 text-xs font-mono"></td>`).join('')}
                <td class="p-2 text-center"><button onclick="saveEdit(${idx})" class="text-emerald-500 font-bold">存</button></td>
            `;
        }

        function saveEdit(idx) {
            let newScores = {};
            let sum = 0;
            players.forEach(p => {
                const v = parseInt(document.getElementById(`es-${idx}-${p}`).value) || 0;
                newScores[p] = v;
                sum += v;
            });
            if (sum === 0) {
                records[idx].date = document.getElementById(`ed-${idx}`).value;
                records[idx].scores = newScores;
                localStorage.setItem('mj_records', JSON.stringify(records));
                updateDashboard();
            } else { alert(`錯誤：總和需為 0 (目前 ${sum})`); }
        }

        // --- 語音輸入 ---
        function startVoice(p) {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) return alert("不支援語音");
            const rec = new SpeechRec();
            rec.lang = 'zh-TW';
            const btn = document.getElementById(`vbtn-${p}`);
            rec.onstart = () => btn.classList.add('recording-pulse');
            rec.onend = () => btn.classList.remove('recording-pulse');
            rec.onresult = (e) => {
                let t = e.results[0][0].transcript;
                let v = t.replace(/負/g, '-').replace(/萬/g, '0000').replace(/千/g, '000').replace(/[^0-9-]/g, '');
                if (v) { document.querySelector(`input[data-player="${p}"]`).value = parseInt(v); calculateTotal(); }
            };
            rec.start();
        }

        // --- UI 渲染邏輯 ---
        function updateDashboard() {
            const filtered = getFilteredRecords();
            renderChart(filtered);
            renderLeaderboard(filtered);
            renderTable(filtered);
        }

        function renderLeaderboard(filtered) {
            const stats = players.map(p => {
                let total = 0, count = 0;
                filtered.forEach(r => { if(r.scores[p] !== undefined) { total += r.scores[p]; count++; } });
                return { name: p, total, count };
            }).sort((a,b) => b.total - a.total);

            document.getElementById('rankingList').innerHTML = stats.map((s, i) => `
                <div onclick="focusPlayer('${s.name}')" class="bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm border ${focusedPlayer === s.name ? 'border-emerald-500 ring-2 ring-emerald-100' : 'border-slate-50'}">
                    <div class="flex items-center gap-3">
                        <span class="font-black text-slate-200">${i+1}</span>
                        <div><p class="font-black">${s.name}</p><p class="text-[10px] text-slate-400">場數: ${s.count}</p></div>
                    </div>
                    <div class="font-mono font-black text-xl ${s.total >= 0 ? 'text-rose-500' : 'text-emerald-600'}">${s.total > 0 ? '+' + s.total : s.total}</div>
                </div>`).join('');
        }

        function renderTable(filtered) {
            document.getElementById('tableHeader').innerHTML = `<th class="p-3 text-left">日期</th>` + players.map(p => `<th class="p-3">${p}</th>`).join('') + `<th></th>`;
            const display = focusedPlayer ? filtered.filter(r => r.scores[focusedPlayer] !== undefined) : filtered;
            document.getElementById('tableBody').innerHTML = [...display].reverse().map(r => {
                const idx = records.indexOf(r);
                return `<tr id="row-${idx}">
                    <td class="p-3 font-bold text-slate-400 whitespace-nowrap">${r.date}</td>
                    ${players.map(p => `<td class="p-3 font-mono ${r.scores[p] > 0 ? 'text-rose-500' : (r.scores[p] < 0 ? 'text-emerald-600' : 'text-slate-200')}">${r.scores[p] ?? '-'}</td>`).join('')}
                    <td class="p-3"><button onclick="enterEditMode(${idx})" class="text-blue-500 font-bold">改</button></td>
                </tr>`;
            }).join('');
        }

        function renderScoreInputs() {
            document.getElementById('scoreInputs').innerHTML = players.map(p => `
                <div class="bg-white p-4 rounded-2xl flex items-center shadow-sm border border-slate-100">
                    <div class="w-1/3 font-black text-slate-600">${p}</div>
                    <div class="w-1/3 text-center"><button onclick="startVoice('${p}')" id="vbtn-${p}" class="text-[10px] bg-slate-100 px-3 py-1 rounded-full text-emerald-600 font-bold">🎤 語音</button></div>
                    <div class="w-1/3"><input type="number" oninput="calculateTotal()" data-player="${p}" placeholder="0" class="score-input w-full text-right text-2xl font-mono font-black border-none focus:outline-none bg-transparent"></div>
                </div>`).join('');
        }

        function calculateTotal() {
            let total = 0, count = 0;
            document.querySelectorAll('.score-input').forEach(i => { if(i.value) { total += parseInt(i.value); count++; } });
            document.getElementById('totalCheck').innerText = total;
            document.getElementById('totalCheck').className = (total === 0) ? "text-4xl font-black text-emerald-400" : "text-4xl font-black text-rose-400";
            document.getElementById('saveBtn').disabled = !(total === 0 && count > 0);
        }

        function saveMatch() {
            const scores = {};
            document.querySelectorAll('.score-input').forEach(i => { if(i.value) scores[i.dataset.player] = parseInt(i.value); });
            records.push({ date: document.getElementById('matchDate').value, scores });
            localStorage.setItem('mj_records', JSON.stringify(records));
            location.reload();
        }

        function focusPlayer(n) { focusedPlayer = n; document.getElementById('resetBtn').classList.remove('hidden'); updateDashboard(); }
        function resetPlayerFilter() { focusedPlayer = null; document.getElementById('resetBtn').classList.add('hidden'); updateDashboard(); }
        function switchTab(t) { 
            document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(e => e.classList.add('text-slate-400'));
            document.getElementById(`${t}-page`).classList.add('active');
            document.getElementById(`tab-${t}`).classList.remove('text-slate-400');
            if(t==='dashboard') updateDashboard();
        }
        function clearData() { if(confirm("確定清空？")) { localStorage.clear(); location.reload(); } }
        function exportExcel() { /* 同 v9.0 */ }
        function importFromExcel(e) { /* 同 v9.0 */ }

        window.onload = () => {
            document.getElementById('matchDate').valueAsDate = new Date();
            renderScoreInputs();
            updateDashboard();
        };
    </script>
</body>
</html>
