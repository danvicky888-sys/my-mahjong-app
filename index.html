<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>麻將競技紀錄系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f1f5f9; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .active-tab { border-bottom: 4px solid #10b981; color: #10b981; font-weight: 900; }
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
    </style>
</head>
<body class="pb-24">

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex z-50 shadow-[0_-5px_15px_rgba(0,0,0,0.05)]">
        <button onclick="switchTab('dashboard')" id="tab-dashboard" class="flex-1 py-4 text-slate-400 transition-all active-tab">📊 戰報</button>
        <button onclick="switchTab('record')" id="tab-record" class="flex-1 py-4 text-slate-400 transition-all">📝 紀錄</button>
        <button onclick="switchTab('admin')" id="tab-admin" class="flex-1 py-4 text-slate-400 transition-all">⚙️ 管理</button>
    </nav>

    <div class="max-w-md mx-auto p-4">
        
        <section id="dashboard-page" class="tab-content active">
            <header class="mb-6 mt-4">
                <h1 class="text-3xl font-black text-slate-800">年度戰績榜</h1>
                <p id="currentSeasonLabel" class="text-slate-500 font-bold uppercase"></p>
            </header>

            <div id="dashboardCard" class="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-6">
                    <span class="text-slate-400 text-sm font-bold">RANKING</span>
                    <button onclick="exportImage()" class="text-xs bg-emerald-50 text-emerald-600 px-3 py-1 rounded-full font-black">📸 分享圖片報表</button>
                </div>
                <div class="space-y-5" id="rankingList">
                    </div>
            </div>
        </section>

        <section id="record-page" class="tab-content">
            <header class="mb-6 mt-4 flex justify-between items-end">
                <h1 class="text-3xl font-black text-slate-800">新增紀錄</h1>
                <input type="date" id="matchDate" class="bg-transparent text-slate-600 font-bold border-none text-right">
            </header>

            <div id="scoreInputs" class="space-y-3 mb-8">
                </div>

            <div class="bg-white p-6 rounded-[2rem] shadow-xl">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-slate-500 font-bold">加總校驗</span>
                    <span id="totalCheck" class="text-4xl font-black text-rose-500">0</span>
                </div>
                <button onclick="saveMatch()" id="saveBtn" class="w-full bg-slate-800 text-white py-5 rounded-2xl font-black text-xl shadow-lg active:scale-95 transition disabled:bg-slate-100 disabled:text-slate-300 disabled:shadow-none" disabled>
                    儲存本局成績
                </button>
            </div>
        </section>

        <section id="admin-page" class="tab-content">
            <header class="mb-6 mt-4">
                <h1 class="text-3xl font-black text-slate-800">系統管理</h1>
            </header>

            <div class="bg-white rounded-3xl p-6 shadow-sm mb-6">
                <h2 class="font-bold text-slate-800 mb-4">👥 參賽名單管理</h2>
                <div class="flex gap-2 mb-4">
                    <input type="text" id="newPlayerName" placeholder="新成員姓名" class="flex-1 bg-slate-100 p-3 rounded-xl focus:outline-emerald-500">
                    <button onclick="addPlayer()" class="bg-emerald-600 text-white px-6 rounded-xl font-bold">新增</button>
                </div>
                <div id="playerManagementList" class="space-y-2">
                    </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-6">
                <button onclick="exportExcel()" class="bg-white border border-slate-200 p-6 rounded-3xl text-center shadow-sm active:bg-slate-50 transition">
                    <div class="text-3xl mb-2">📊</div>
                    <div class="font-bold text-slate-700">匯出 Excel</div>
                </button>
                <button onclick="clearData()" class="bg-white border border-rose-100 p-6 rounded-3xl text-center shadow-sm active:bg-rose-50 transition">
                    <div class="text-3xl mb-2">🗑️</div>
                    <div class="font-bold text-rose-600">清除紀錄</div>
                </button>
            </div>
        </section>

    </div>

    <script>
        const DEFAULT_PLAYERS = ["Daniel", "Ken", "Roger", "CK", "Totoron", "Host"];
        let players = JSON.parse(localStorage.getItem('mj_players')) || DEFAULT_PLAYERS;
        let records = JSON.parse(localStorage.getItem('mj_records')) || [];

        window.onload = () => {
            document.getElementById('matchDate').valueAsDate = new Date();
            updateSeasonLabel();
            renderScoreInputs();
            updateDashboard();
        };

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active-tab'));
            
            document.getElementById(`${tabId}-page`).classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active-tab');
            
            if(tabId === 'admin') renderPlayerManagement();
            if(tabId === 'dashboard') updateDashboard();
        }

        function updateSeasonLabel() {
            const date = new Date();
            const year = date.getFullYear();
            const quarter = Math.ceil((date.getMonth() + 1) / 3);
            document.getElementById('currentSeasonLabel').innerText = `${year} / Q${quarter} 賽季中`;
        }

        // --- 第二介面：新增紀錄邏輯 ---
        function renderScoreInputs() {
            const container = document.getElementById('scoreInputs');
            container.innerHTML = players.map(p => `
                <div class="bg-white p-4 rounded-2xl flex items-center shadow-sm border border-slate-50">
                    <div class="w-1/2">
                        <span class="block font-black text-slate-700 text-lg">${p}</span>
                        <button onclick="startVoice('${p}')" class="text-xs text-emerald-500 font-bold mt-1">🎤 語音輸入</button>
                    </div>
                    <div class="w-1/2">
                        <input type="number" oninput="calculateTotal()" data-player="${p}" placeholder="0" 
                            class="score-input w-full text-right text-3xl font-mono font-black text-slate-800 bg-transparent border-none focus:ring-0">
                    </div>
                </div>
            `).join('');
        }

        function calculateTotal() {
            const inputs = document.querySelectorAll('.score-input');
            let total = 0, hasValue = false;
            inputs.forEach(input => {
                if(input.value !== "") { total += Number(input.value); hasValue = true; }
            });
            const display = document.getElementById('totalCheck');
            const saveBtn = document.getElementById('saveBtn');
            display.innerText = total;
            if (total === 0 && hasValue) {
                display.className = "text-4xl font-black text-emerald-500";
                saveBtn.disabled = false;
            } else {
                display.className = "text-4xl font-black text-rose-500";
                saveBtn.disabled = true;
            }
        }

        function saveMatch() {
            const date = document.getElementById('matchDate').value;
            const scores = {};
            document.querySelectorAll('.score-input').forEach(input => {
                scores[input.dataset.player] = Number(input.value || 0);
            });
            records.push({ date, scores });
            localStorage.setItem('mj_records', JSON.stringify(records));
            document.querySelectorAll('.score-input').forEach(i => i.value = '');
            calculateTotal();
            alert('✅ 已記錄成績，請至戰報查看排名');
            switchTab('dashboard');
        }

        // --- 第一介面：數據看板邏輯 ---
        function updateDashboard() {
            const currentYear = new Date().getFullYear();
            const currentQuarter = Math.ceil((new Date().getMonth() + 1) / 3);
            
            const stats = players.map(p => {
                let yearly = 0, quarterly = 0, count = 0;
                records.forEach(r => {
                    const rDate = new Date(r.date);
                    const val = r.scores[p] || 0;
                    if (rDate.getFullYear() === currentYear && val !== 0) {
                        yearly += val; count++;
                        if (Math.ceil((rDate.getMonth() + 1) / 3) === currentQuarter) quarterly += val;
                    }
                });
                return { name: p, count, yearly, quarterly };
            });

            stats.sort((a, b) => b.yearly - a.yearly);

            const list = document.getElementById('rankingList');
            list.innerHTML = stats.map((s, idx) => `
                <div class="flex items-center justify-between border-b border-slate-50 pb-4 last:border-0">
                    <div class="flex items-center gap-4">
                        <span class="text-xl font-black ${idx==0?'text-amber-400':idx==1?'text-slate-400':idx==2?'text-orange-400':'text-slate-200'}">${idx+1}</span>
                        <div>
                            <p class="font-black text-slate-800 text-lg">${s.name}</p>
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">Matches: ${s.count} / Season: ${s.quarterly}</p>
                        </div>
                    </div>
                    <div class="text-right font-mono font-black text-2xl ${s.yearly >= 0 ? 'text-rose-500' : 'text-emerald-600'}">
                        ${s.yearly > 0 ? '+' + s.yearly : s.yearly}
                    </div>
                </div>
            `).join('');
        }

        // --- 第三介面：管理員邏輯 ---
        function renderPlayerManagement() {
            const list = document.getElementById('playerManagementList');
            list.innerHTML = players.map((p, i) => `
                <div class="flex justify-between items-center bg-slate-50 p-4 rounded-2xl border border-slate-100">
                    <span class="font-bold text-slate-700">${p}</span>
                    <button onclick="removePlayer(${i})" class="text-rose-400 text-sm font-bold">移除</button>
                </div>
            `).join('');
            localStorage.setItem('mj_players', JSON.stringify(players));
        }

        function addPlayer() {
            const name = document.getElementById('newPlayerName').value.trim();
            if (name && !players.includes(name)) {
                players.push(name);
                document.getElementById('newPlayerName').value = '';
                renderPlayerManagement();
                renderScoreInputs();
            }
        }

        function removePlayer(index) {
            if(confirm("確定要移除這位成員嗎？")) {
                players.splice(index, 1);
                renderPlayerManagement();
                renderScoreInputs();
            }
        }

        // 語音與匯出
        function startVoice(playerName) {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'zh-TW';
            recognition.start();
            recognition.onresult = (event) => {
                let score = parseInt(event.results[0][0].transcript.replace(/[^0-9-]/g, ''));
                if (!isNaN(score)) {
                    document.querySelector(`input[data-player="${playerName}"]`).value = score;
                    calculateTotal();
                }
            };
        }

        function exportExcel() {
            const wsData = records.map(r => ({ "日期": r.date, ...r.scores }));
            const ws = XLSX.utils.json_to_sheet(wsData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "MJ_History");
            XLSX.writeFile(wb, `Mahjong_Records_${new Date().getFullYear()}.xlsx`);
        }

        function exportImage() {
            const el = document.getElementById('dashboardCard');
            html2canvas(el, { backgroundColor: "#ffffff", scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `年度戰報_${new Date().toISOString().slice(0,10)}.png`;
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        function clearData() {
            if(confirm("⚠️ 注意：此操作將永久刪除所有歷史比賽紀錄且無法復原！確定嗎？")) {
                localStorage.removeItem('mj_records');
                location.reload();
            }
        }
    </script>
</body>
</html>
